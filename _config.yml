# Site settings
title: Peter Nguyen
description: Clinical Data Analyst | Health Data Scientist | Analytics Consultant
author: Peter Nguyen
email: peter.nguyen539@gmail.com
url: "https://peternguyen-au.github.io"
baseurl: ""

# Social media links
github_username: peternguyen-au
linkedin_username: peternguyen2

# Build settings
theme: jekyll-theme-cayman
markdown: kramdown
highlighter: rouge

# Collections for blog posts
collections:
  posts:
    output: true
    permalink: /blog/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude files from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock